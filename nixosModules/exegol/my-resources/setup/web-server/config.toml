[profiles.updog_web]
type = "updog"
interface = "ens33u1"
port = 80
directory = "/workspace/web/"
password = ""

[profiles.updog_resources]
type = "updog"
interface = "ens33u1"
port = 80
directory = "/opt/resources/"
password = ""

[profiles.goshs_web]
type = "goshs"
interface = "ens33u1"
directory = "/workspace/web/"
config_file = "/root/.webserver_tui/goshs_web.json"

[profiles.goshs_resources]
type = "goshs"
interface = "ens33u1"
directory = "/opt/my-resources/"
config_file = "/root/.webserver_tui/goshs_resources.json"